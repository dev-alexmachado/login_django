{% extends 'base-home.html' %}
{% block title %}Home Page{% endblock %}
{% block content %}
    <form action="{% url 'alterar_pessoa' pessoa.id_pessoa %}" method="POST">
        {% csrf_token %}
        <label for="nome">Nome:</label><br>
        <input type="text" name="nome" id="nome" value="{{ pessoa.nome }}" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email" value="{{ pessoa.email }}" required><br><br>
        <label for="data_nascimento">Data de Nascimento:</label><br>
        <input type="date" name="data_nascimento" id="data_nascimento" value="{{ pessoa.data_nascimento|date:'Y-m-d' }}" required><br><br>
        <button type="submit">Alterar</button>
    </form>
{% endblock %}
